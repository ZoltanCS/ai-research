[project]
name = "localmind-backend"
version = "0.1.0"
description = "LocalMind AI research and chat backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
