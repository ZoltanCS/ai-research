services:

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localmind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - localmind
    restart: unless-stopped

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localmind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override with Docker-internal hostnames (take precedence over .env values)
      DATABASE_URL: postgresql+asyncpg://localmind:localmind@postgres:5432/localmind
      REDIS_URL: redis://redis:6379
      # Ollama runs on the Docker host.
      # Docker Desktop (Mac/Windows): host.docker.internal resolves automatically.
      # Linux: set OLLAMA_HOST=http://172.17.0.1:11434 in your .env file.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - localmind
    restart: unless-stopped

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: localmind-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: localmind
      POSTGRES_PASSWORD: localmind
      POSTGRES_DB: localmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localmind -d localmind"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - localmind
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: localmind-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - localmind
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  localmind:
    driver: bridge
